# Lint configuration (Phase 0.3).
# Base: flutter_lints. Language strictness is turned on for the whole
# project - the puzzle engine in lib/engine must stay strictly typed.
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Flutter 3.50 deprecates the bundled material.dart in favour of
    # package:material_ui, which is not a pub dependency of this
    # project (PR #31 CI verdict, issue #2 comment 7229591289):
    # keep the material.dart import and silence the info instead.
    deprecated_member_use: ignore
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    # Keep production code free of debug prints (tool/ uses stdout.writeln).
    avoid_print: true
